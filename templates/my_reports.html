{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>My Reports</h2>

    {% for report in reports %}
        <div>
            <p>{{ report.description }}</p>
            <a href="{{ report.report.url }}" target="_blank">Download</a>
        </div>
    {% empty %}
        <p>No reports uploaded.</p>
    {% endfor %}

</div>
{% endblock %}
