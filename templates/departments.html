{% extends 'base.html' %}
{% load static %}

{% block title %}<title>Departments</title>{% endblock %}

{% block content %}

<div class="container mt-5">

  <!-- HEADER -->
  <div class="text-center mb-5">
    <h2 class="fw-bold text-white">Our Departments</h2>
    <p class="text-white-50">
      Explore our specialized medical departments with expert care
    </p>
  </div>

  <!-- DEPARTMENTS GRID -->
  <div class="row g-4">

    {% for d in dept %}
    <div class="col-md-4">

      <div class="card department-card h-100 border-0 shadow-sm p-4 text-center">

        <!-- ICON -->
        <div class="mb-3">
          <i class="fa-solid fa-hospital text-primary"
             style="font-size: 40px;"></i>
        </div>

        <!-- TITLE -->
        <h5 class="fw-bold">{{ d.dep_name }}</h5>

        <!-- DESCRIPTION -->
        <p class="text-muted small">
          {{ d.dep_description }}
        </p>

      </div>

    </div>
    {% endfor %}

  </div>

</div>

{% endblock %}
