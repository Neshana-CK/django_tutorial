{% extends 'base.html' %}

{% block title %}<title>Contact Us</title>{% endblock %}

{% block content %}

<div class="container mt-5">

  <!-- HEADER -->
  <div class="text-center mb-5">
    <h2 class="fw-bold text-white">Get in Touch</h2>
    <p class="text-white-50">We’re here to help you 24/7</p>
  </div>

  <div class="row g-4">

    <!-- CONTACT FORM -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-4 rounded">

        <h5 class="fw-semibold mb-3">Send a Message</h5>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Your Name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Your Email">
          </div>

          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message..."></textarea>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              Send Message
            </button>
          </div>

        </form>

      </div>
    </div>

    <!-- CONTACT INFO + MAP -->
    <div class="col-md-6">

      <!-- INFO CARDS -->
      <div class="row g-3 mb-3">

        <div class="col-6">
          <div class="p-3 bg-white rounded shadow-sm text-center">
            <i class="fa-solid fa-phone text-primary mb-2"></i>
            <p class="mb-0 fw-semibold">+91 9876543210</p>
          </div>
        </div>

        <div class="col-6">
          <div class="p-3 bg-white rounded shadow-sm text-center">
            <i class="fa-solid fa-envelope text-primary mb-2"></i>
            <p class="mb-0 fw-semibold">hospital@email.com</p>
          </div>
        </div>

      </div>

      <!-- MAP -->
      <div class="rounded shadow-sm overflow-hidden">
        <iframe 
          src="https://www.google.com/maps?q=kochi&output=embed"
          width="100%" height="250" style="border:0;">
        </iframe>
      </div>

    </div>

  </div>

</div>

{% endblock %}
